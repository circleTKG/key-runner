<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Typing Dungeon - Neon Depths</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');
:root{--ink:#edf7ff;--muted:#91a7bd;--panel:rgba(9,18,31,.82);--line:#26445e;--cyan:#5de7ff;--red:#ff557d;--gold:#ffd166;--green:#58e89a}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px;background:#050910;color:var(--ink);font-family:'Zen Kaku Gothic New','Space Grotesk',sans-serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.3;background:linear-gradient(rgba(93,231,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(93,231,255,.035) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,black,transparent 85%)}
.game{width:min(1320px,100%);margin:auto;position:relative}.topbar{display:flex;justify-content:space-between;align-items:end;gap:18px;margin:0 0 16px}.eyebrow{margin:0 0 3px;color:var(--cyan);font:600 11px 'Space Grotesk',sans-serif;letter-spacing:.22em;text-transform:uppercase}.topbar h1{margin:0;font:700 clamp(25px,4vw,42px)/1 'Space Grotesk',sans-serif;letter-spacing:0}.topbar h1 span{color:var(--red)}.stats{display:flex;gap:9px}.stat{min-width:104px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:linear-gradient(145deg,rgba(20,42,62,.9),rgba(8,18,30,.9));box-shadow:0 0 24px #051a2a}.stat small{display:block;color:var(--muted);font:600 10px 'Space Grotesk',sans-serif;letter-spacing:.16em}.stat b{font:700 23px 'Space Grotesk',sans-serif}.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(250px,.72fr);gap:14px}.panel,.typing{border:1px solid var(--line);background:var(--panel);box-shadow:0 18px 60px #02060dcc,inset 0 1px #ffffff0a;backdrop-filter:blur(12px)}.panel{padding:12px;border-radius:15px}.scene-wrap{position:relative;overflow:hidden;border-radius:10px;border:1px solid #27506a;background:#02070e;aspect-ratio:16/10}.scene-wrap:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 42%,#02060e99 100%),linear-gradient(transparent 50%,#5de7ff08 50%);background-size:auto,100% 4px;mix-blend-mode:screen}.scene-wrap canvas{width:100%;height:100%;display:block}.scene-hud{position:absolute;z-index:2;inset:14px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;font:600 10px 'Space Grotesk',sans-serif;letter-spacing:.1em;color:#b3d8e8;text-transform:uppercase}.signal{display:flex;align-items:center;gap:7px}.signal i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}.coords{color:#6d91a8}.help{margin:9px 2px 0;color:var(--muted);font-size:12px}.map-head{display:flex;justify-content:space-between;align-items:center;margin:1px 2px 10px}.map-head h2{margin:0;font:600 14px 'Space Grotesk',sans-serif;letter-spacing:.12em}.map-head span{color:var(--muted);font-size:11px}.map{width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(15,1fr);gap:2px;padding:7px;border:1px solid #1d3a51;border-radius:10px;background:#06111b}.cell{position:relative;border-radius:2px;background:#0d2534}.wall{background:linear-gradient(135deg,#1b4055,#0e2434);box-shadow:inset 0 0 0 1px #28536a}.lock{background:#63233b;box-shadow:0 0 9px #ff557d88}.goal{background:#a66f26;box-shadow:0 0 12px #ffd166}.player{background:var(--green);box-shadow:0 0 12px var(--green);z-index:1}.legend{display:flex;justify-content:space-between;margin-top:11px;color:var(--muted);font-size:11px}.legend b{color:var(--ink);font-weight:500}.typing{display:grid;grid-template-columns:1fr auto;gap:7px 18px;align-items:center;margin-top:14px;padding:15px 17px;border-radius:14px}.prompt{color:var(--muted);font-size:13px}.word{min-height:39px;color:var(--cyan);font:700 31px/1.2 'Space Grotesk',sans-serif;letter-spacing:.08em;text-shadow:0 0 18px #5de7ff88}.typing input{grid-column:1/-1;width:100%;border:1px solid #31546e;border-radius:8px;background:#040b13;color:var(--ink);padding:12px 14px;outline:0;font:600 18px 'Space Grotesk',sans-serif;text-align:center;transition:.2s}.typing input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #5de7ff18,0 0 22px #5de7ff22}.msg{grid-column:1/-1;min-height:20px;color:var(--gold);font-size:13px;font-weight:700}.button{border:1px solid #376891;border-radius:7px;background:#113a5c;color:var(--ink);padding:9px 14px;font:600 12px 'Space Grotesk',sans-serif;cursor:pointer;transition:.2s}.button:hover{border-color:var(--cyan);background:#145376;box-shadow:0 0 18px #5de7ff33}.overlay{position:fixed;inset:0;z-index:10;display:none;place-items:center;background:#02060ecc;backdrop-filter:blur(8px)}.overlay.show{display:grid}.modal{width:min(430px,90%);padding:34px;text-align:center;border:1px solid #487b98;border-radius:16px;background:linear-gradient(145deg,#102a3b,#08121d);box-shadow:0 0 70px #5de7ff22}.modal h2{margin:0 0 8px;font:700 32px 'Space Grotesk',sans-serif;color:var(--cyan)}.modal p{color:var(--muted);line-height:1.8}.modal .button{margin-top:10px}.fallback{display:none;padding:26px;color:var(--red);font-weight:700}
@media(max-width:800px){body{padding:11px}.topbar{align-items:start;flex-direction:column}.stats{width:100%}.stat{flex:1}.layout{grid-template-columns:1fr}.typing{grid-template-columns:1fr}.word{grid-row:2}.typing .button{grid-row:3}.scene-wrap{aspect-ratio:4/3}}
</style>
<style>
.player:after{content:"";position:absolute;left:50%;top:50%;width:0;height:0;border-top:4px solid transparent;border-bottom:4px solid transparent;border-left:7px solid #062019;transform:translate(-25%,-50%) rotate(var(--heading,0rad));transform-origin:25% 50%;filter:drop-shadow(0 0 2px #effff5)}
.player:before{content:"";position:absolute;inset:2px;border:1px solid #effff5;border-radius:50%;opacity:.75}
</style>
<style>
.game{width:min(1440px,100%)}
.layout{grid-template-columns:45% 45%;justify-content:space-between;gap:0}
.scene-wrap{height:clamp(460px,68vh,760px);aspect-ratio:auto}
.panel:first-child{display:flex;flex-direction:column}.panel:first-child .help{flex:0 0 auto}
.typing{position:fixed;z-index:6;left:50%;bottom:24px;width:min(560px,calc(100% - 28px));margin:0;transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.typing.open{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.typing .restart{display:none}
.restart-top{display:block;margin:0 0 10px auto}
@media(max-width:800px){.layout{grid-template-columns:1fr;gap:14px}.scene-wrap{height:min(68vh,560px);min-height:360px}}
</style>
<style>
 .game{width:min(1600px,100%)}
 .layout{grid-template-columns:50% 40%;justify-content:space-between;gap:0}
 .scene-wrap{height:clamp(520px,72vh,820px)}
 @media(max-width:800px){.game{width:1600px;max-width:none}.layout{grid-template-columns:50% 40%;justify-content:space-between;gap:0}.scene-wrap{height:clamp(520px,72vh,820px);min-height:520px}}
</style>
</head>
<body>
<main class="game">
<header class="topbar"><div><p class="eyebrow">Sector 07 / Neural Labyrinth</p><h1>Typing <span>Dungeon</span></h1></div><div class="stats"><div class="stat"><small>TIME</small><b id="time">300</b></div><div class="stat"><small>SCORE</small><b id="score">0</b></div></div></header>
<div class="layout">
<section class="panel"><div class="scene-wrap" id="scene"><div class="scene-hud"><span class="signal"><i></i>LIVE EXPLORATION</span><span class="coords" id="coords">X 01.5 / Y 01.5</span></div><div class="fallback" id="fallback">Three.jsの読み込みに失敗しました。ネットワーク接続を確認してください。</div></div><div class="help">W：向いている方向へ進む　A/D：旋回　←/→：旋回　Shift：高速移動　｜　赤い扉の前でタイピング</div></section>
<section class="panel"><div class="map-head"><h2>TACTICAL MAP</h2><span>15 × 15 GRID</span></div><div class="map" id="map"></div><div class="legend"><b>▲ 自分の向き</b><b>● 扉</b><b>● ゴール</b></div><div class="help">矢印が現在の視線方向。迷宮の奥にある脱出ゲートへ向かおう。</div></section>
</div>
<button class="button restart-top" id="restart">リスタート</button><section class="typing"><div class="prompt" id="prompt">探索して、赤いタイピング扉を探そう。</div><div class="word" id="word">---</div><input id="input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="扉の前で単語を入力してEnter"><div class="msg" id="msg">WASDで探索開始。</div></section>
</main>
<div class="overlay" id="overlay"><div class="modal"><h2 id="title"></h2><p id="result"></p><button class="button" id="again">もう一度</button></div></div>
<script type="module">
let THREE;
const raw=["###############","#S....#.......#","#.###.#.#####.#","#...#.#.....#.#","###.#.#####.#.#","#...#.....#...#","#.#.#####.#.#.#","#.#...L...#...#","#.#####.#####.#","#.....#.....#.#","#.###.#####.#.#","#...#.......#.#","###.#########.#","#............G#","###############"]; 
const grid=raw.map(row=>row.split("")),H=grid.length,W=grid[0].length,start={x:1.5,y:1.5},goal={x:13.5,y:13.5},p={x:start.x,y:start.y,a:0};
const words=["apple","keyboard","computer","forest","rocket","window","programming","dungeon","adventure","monster","future","typing","galaxy"];
let unlocked=new Set(),activeDoor=null,word="",score=0,time=300,ended=false,timer,doorMeshes=[];
const sceneEl=document.getElementById("scene"),fallback=document.getElementById("fallback"),mapEl=document.getElementById("map"),typingEl=document.querySelector(".typing"),input=document.getElementById("input"),wordEl=document.getElementById("word"),prompt=document.getElementById("prompt"),msg=document.getElementById("msg"),coords=document.getElementById("coords"),keys={};
let renderer,scene,camera,mazeGroup,doorGroup,goalGroup,goalCore,avatarGroup;
startThree();
async function startThree(){try{THREE=await import("https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js");initThree()}catch(error){fallback.style.display="block";fallback.textContent=`Three.jsを起動できません：${error.message}`;console.error(error)}}
function initThree(){scene=new THREE.Scene();scene.background=new THREE.Color(0x040a12);scene.fog=new THREE.FogExp2(0x07131e,.047);camera=new THREE.PerspectiveCamera(72,1,.05,100);camera.position.set(p.x,1.62,p.y);camera.rotation.order="YXZ";renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(800,500,false);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;sceneEl.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0x8bdcff,0x07111d,.7));const moon=new THREE.DirectionalLight(0x4c8cff,1.15);moon.position.set(-7,12,-5);scene.add(moon);mazeGroup=new THREE.Group();doorGroup=new THREE.Group();goalGroup=new THREE.Group();scene.add(mazeGroup,doorGroup,goalGroup);buildMaze();buildGoal();resize();window.addEventListener("resize",resize);reset();requestAnimationFrame(loop)}
function mat(color,rough=.7,metal=0){return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal})}
function buildMaze(){mazeGroup.clear();doorGroup.clear();doorMeshes=[];const floorMat=mat(0x3a6978,.62,.22),wallMat=mat(0x0d1d32,.5,.7),ceilingMat=mat(0x060d18,.9);const floor=new THREE.Mesh(new THREE.PlaneGeometry(W,H),floorMat);floor.rotation.x=-Math.PI/2;floor.position.set(W/2,0,H/2);mazeGroup.add(floor);const ceiling=new THREE.Mesh(new THREE.PlaneGeometry(W,H),ceilingMat);ceiling.rotation.x=Math.PI/2;ceiling.position.set(W/2,3.7,H/2);mazeGroup.add(ceiling);const lineMat=new THREE.MeshBasicMaterial({color:0x7ee9e0,transparent:true,opacity:.32});for(let i=0;i<=W;i++){const line=new THREE.Mesh(new THREE.PlaneGeometry(.012,H),lineMat);line.rotation.x=-Math.PI/2;line.position.set(i,.012,H/2);mazeGroup.add(line)}for(let i=0;i<=H;i++){const line=new THREE.Mesh(new THREE.PlaneGeometry(W,.012),lineMat);line.rotation.x=-Math.PI/2;line.position.set(W/2,.013,i);mazeGroup.add(line)}for(let y=0;y<H;y++)for(let x=0;x<W;x++){const value=grid[y][x];if(value==="#"){const wall=new THREE.Mesh(new THREE.BoxGeometry(.9,3.7,.9),wallMat);wall.position.set(x+.5,1.85,y+.5);mazeGroup.add(wall);const strip=new THREE.Mesh(new THREE.BoxGeometry(.025,3.1,.025),new THREE.MeshBasicMaterial({color:0x39ddff}));strip.position.set(x+.5,1.85,y+.02);mazeGroup.add(strip)}if(value==="L")buildDoor(x,y)}const lamps=[[-.45,0x42dfff],[W+.45,0xff557d],[0,H*.5,0xff557d],[W,H*.52,0xffd166]];lamps.forEach(([x,y,color])=>{const light=new THREE.PointLight(color,2.4,8);light.position.set(x,2.6,y);mazeGroup.add(light)})}
function buildDoor(x,y){const group=new THREE.Group();group.position.set(x+.5,0,y+.5);group.userData.id=doorId(x,y);const frameMat=new THREE.MeshStandardMaterial({color:0x40182b,emissive:0x8b183c,emissiveIntensity:2.3,metalness:.5,roughness:.3});const panel=new THREE.Mesh(new THREE.BoxGeometry(.76,2.65,.12),frameMat);panel.position.y=1.35;group.add(panel);const left=new THREE.Mesh(new THREE.BoxGeometry(.08,3,.16),frameMat),right=left.clone();left.position.set(-.45,1.5,0);right.position.set(.45,1.5,0);group.add(left,right);const lamp=new THREE.PointLight(0xff3d73,2.8,3);lamp.position.set(0,2.7,.25);group.add(lamp);doorGroup.add(group);doorMeshes.push(group)}
function buildGoal(){goalGroup.clear();const gold=new THREE.MeshStandardMaterial({color:0xffb52e,emissive:0xff8c18,emissiveIntensity:2.8,metalness:.35,roughness:.25});const ring=new THREE.Mesh(new THREE.TorusGeometry(.42,.06,10,32),gold);ring.rotation.x=Math.PI/2;ring.position.set(goal.x,.2,goal.y);goalGroup.add(ring);goalCore=new THREE.Mesh(new THREE.OctahedronGeometry(.23,1),gold);goalCore.position.set(goal.x,1.2,goal.y);goalGroup.add(goalCore);const light=new THREE.PointLight(0xffb52e,4,5);light.position.set(goal.x,1.3,goal.y);goalGroup.add(light)}
function buildPlayerAvatar(){avatarGroup=new THREE.Group();const bodyMat=new THREE.MeshStandardMaterial({color:0x58e89a,emissive:0x18a86b,emissiveIntensity:1.8,metalness:.25,roughness:.3}),visorMat=new THREE.MeshStandardMaterial({color:0x071c2d,emissive:0x31d8ff,emissiveIntensity:2.2,metalness:.55,roughness:.18});const body=new THREE.Mesh(new THREE.CapsuleGeometry(.2,.42,4,10),bodyMat);body.position.y=.55;avatarGroup.add(body);const visor=new THREE.Mesh(new THREE.SphereGeometry(.18,16,10),visorMat);visor.scale.set(1,.72,.62);visor.position.set(.13,.91,0);avatarGroup.add(visor);const beacon=new THREE.Mesh(new THREE.ConeGeometry(.09,.22,8),new THREE.MeshBasicMaterial({color:0x5de7ff}));beacon.rotation.z=-Math.PI/2;beacon.position.set(.28,.62,0);avatarGroup.add(beacon);const ring=new THREE.Mesh(new THREE.TorusGeometry(.3,.025,8,24),new THREE.MeshBasicMaterial({color:0x58e89a,transparent:true,opacity:.7}));ring.rotation.x=Math.PI/2;ring.position.y=.05;avatarGroup.add(ring);scene.add(avatarGroup);scene.add(new THREE.AmbientLight(0xb9eaff,.65))}
function resize(){if(!renderer)return;const width=sceneEl.clientWidth,height=sceneEl.clientHeight;camera.aspect=width/height;camera.updateProjectionMatrix();renderer.setSize(width,height,false)}
function doorId(x,y){return Math.floor(y)+","+Math.floor(x)}function cell(x,y){return grid[Math.floor(y)]?.[Math.floor(x)]||"#"}function blocked(x,y){const value=cell(x,y);return value==="#"||(value==="L"&&!unlocked.has(doorId(x,y)))}
function move(dx,dy){if(!blocked(p.x+dx,p.y))p.x+=dx;if(!blocked(p.x,p.y+dy))p.y+=dy}
function moveRelative(direction){move(Math.cos(p.a)*direction,Math.sin(p.a)*direction)}
function updatePlayer(){if(ended)return;if(!avatarGroup)buildPlayerAvatar();avatarGroup.visible=false;renderer.toneMappingExposure=1.45;scene.fog.density=.026;const speed=(keys.ShiftLeft||keys.ShiftRight)?.09:.06;if(keys.KeyW||keys.ArrowUp)moveRelative(speed);if(keys.KeyA||keys.ArrowLeft)p.a-=.045;if(keys.KeyD||keys.ArrowRight)p.a+=.045;camera.position.set(p.x,1.18,p.y);camera.rotation.set(0,-p.a-Math.PI/2,0);const distance=Math.hypot(p.x-goal.x,p.y-goal.y);if(distance<.5)finish(true)}
function nearDoor(){let best=null,bestDistance=1;for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(grid[y][x]==="L"&&!unlocked.has(doorId(x,y))){const distance=Math.hypot(x+.5-p.x,y+.5-p.y);if(distance<bestDistance){bestDistance=distance;best={x,y,id:doorId(x,y)}}}return best}
function updateDoorVisuals(now){doorMeshes.forEach(door=>{door.visible=unlocked.has(door.userData.id)===false});const near=nearDoor();const wasNear=Boolean(activeDoor);activeDoor=near;typingEl.classList.toggle("open",Boolean(near));if(near){prompt.textContent="🔒 タイピング扉の前です。単語を入力して開けよう。";wordEl.textContent=word;if(!wasNear)input.focus()}else{prompt.textContent="探索中……赤い扉を探そう。";wordEl.textContent="---"}input.disabled=!near;if(goalCore){goalCore.rotation.y=now*.0012;goalCore.position.y=1.2+Math.sin(now*.002)*.12}}
function drawMap(){mapEl.innerHTML="";for(let y=0;y<H;y++)for(let x=0;x<W;x++){const item=document.createElement("div"),value=grid[y][x];item.className="cell "+(value==="#"?"wall":value==="L"&&!unlocked.has(doorId(x,y))?"lock":value==="G"?"goal":"");if(Math.floor(p.x)===x&&Math.floor(p.y)===y)item.className="cell player";mapEl.appendChild(item)}}
function chooseWord(){word=words[Math.floor(Math.random()*words.length)]}function updateHud(){document.getElementById("score").textContent=score;document.getElementById("time").textContent=time;coords.textContent=`X ${p.x.toFixed(1).padStart(4,"0")} / Y ${p.y.toFixed(1).padStart(4,"0")}`}
function finish(win){if(ended)return;ended=true;clearInterval(timer);document.getElementById("title").textContent=win?"GATE BREACHED":"TIME UP";document.getElementById("result").innerHTML=win?`脱出成功！<br>スコア：<b>${score}</b>`:`時間切れ。<br>スコア：<b>${score}</b>`;document.getElementById("overlay").classList.add("show")}
function reset(){p.x=start.x;p.y=start.y;p.a=0;unlocked=new Set();score=0;time=300;ended=false;activeDoor=null;typingEl.classList.remove("open");chooseWord();input.value="";msg.textContent="WASDで探索開始。";document.getElementById("overlay").classList.remove("show");buildMaze();drawMap();updateHud();clearInterval(timer);timer=setInterval(()=>{if(!ended){time--;updateHud();if(time<=0)finish(false)}},1000)}
function loop(now){updatePlayer();updateDoorVisuals(now);updateHud();drawMap();renderer.render(scene,camera);requestAnimationFrame(loop)}
const movementCodes=new Set(["KeyW","KeyA","KeyD","ArrowUp","ArrowLeft","ArrowRight"]);
document.addEventListener("keydown",event=>{if(event.target===input)return;if(movementCodes.has(event.code)){keys[event.code]=true;event.preventDefault()}});
document.addEventListener("keyup",event=>{keys[event.code]=false});
window.addEventListener("blur",()=>{movementCodes.forEach(code=>keys[code]=false)});
document.addEventListener("visibilitychange",()=>{if(document.hidden)movementCodes.forEach(code=>keys[code]=false)});
input.addEventListener("keydown",event=>{if(event.key!=="Enter"||ended)return;if(!activeDoor){msg.textContent="タイピング扉の近くにいません。";return}if(input.value.trim().toLowerCase()===word){unlocked.add(activeDoor.id);score+=250;time=Math.min(150,time+8);msg.textContent="正解！扉が開いた。+250 / +8秒";input.value="";chooseWord();drawMap()}else{time=Math.max(0,time-5);updateHud();msg.textContent="不正解。5秒減少。";input.select()}});
document.getElementById("restart").onclick=reset;document.getElementById("again").onclick=reset;
setInterval(()=>mapEl.style.setProperty("--heading",`${p.a}rad`),50);
</script>
</body>
</html>
