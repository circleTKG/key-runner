<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Key-Runner</title>
    <link rel="stylesheet" href="style/game.css">
    <link rel="stylesheet" href="style/layout.css">
    <link rel="stylesheet" href="style/interaction.css">
</head>
<body>
    <main class="game">
        <header class="topbar">
            <div>
                <h1>Key-Runner</h1>
            </div>
            <div class="stats">
                <div class="stat"><small>TIME</small><b id="time">300</b></div>
                <div class="stat"><small>SCORE</small><b id="score">0</b></div>
            </div>
        </header>

        <div class="layout">
            <section class="panel">
                <div class="scene-wrap" id="scene">
                    <div class="scene-hud">
                        <span class="signal"><i></i>LIVE EXPLORATION</span>
                        <span class="coords" id="coords">X 01.5 / Y 01.5</span>
                    </div>
                    <div class="fallback" id="fallback">Three.jsの読み込みに失敗しました。</div>
                </div>
            </section>

            <section class="panel">
                <div class="map-head">
                    <h2>TACTICAL MAP</h2>
                    <span>15 × 15 GRID</span>
                </div>
                <div class="map" id="map"></div>
                <div class="legend"><b>▲ 自分の向き</b><b>● ゴール</b></div>
                <div class="help">矢印が現在の視線方向。迷宮の奥にある脱出ゲートへ向かおう。</div>
            </section>
        </div>

        <button class="button restart-top" id="restart">リスタート</button>
        <section class="typing">
            <div class="prompt" id="prompt">探索して、赤いタイピング扉を探そう。</div>
            <div class="word" id="word">---</div>
            <input id="input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="扉の前で単語を入力してEnter">
            <div class="msg" id="msg">WASDで探索開始。</div>
        </section>
    </main>

    <div class="overlay" id="overlay">
        <div class="modal">
            <h2 id="title"></h2>
            <p id="result"></p>
            <button class="button" id="again">もう一度</button>
        </div>
    </div>

    <script type="module" src="src/game.js"></script>
</body>
</html>
