<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101f2c">
  <title>Key-Runner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="./" aria-label="Key-Runner ランキング">
      <img src="./logo/logo.png" alt="Key-Runner">
    </a>
    <a class="game-link" href="about">ゲームへ <span aria-hidden="true">↗</span></a>
  </header>

  <main class="page-shell">
    <section class="intro" aria-labelledby="page-title">
      <div class="intro__copy">
        <p class="eyebrow"><span class="live-dot" aria-hidden="true"></span> ONLINE LEADERBOARD</p>
        <h1 id="page-title">ランキング</h1>
        <p class="intro__description">Key-Runner / RTA any%</p>
      </div>
      <div class="intro__aside" aria-label="ランキング更新情報">
        <span class="intro__aside-label">BEST CLEAR TIME</span>
        <strong id="best-time">--:--:--</strong>
      </div>
    </section>

    <section class="board" aria-labelledby="board-title">
      <div class="board__topline">
        <div>
          <p class="eyebrow">ALL RUNS</p>
          <h2 id="board-title">RTA any%</h2>
        </div>
        <button class="refresh-button" id="refresh" type="button" aria-label="ランキングを更新">
          <span aria-hidden="true">↻</span><span>更新</span>
        </button>
      </div>

      <p class="board-message" id="message" role="status" aria-live="polite">読み込み中...</p>
      <ol class="score-list" id="scores" aria-label="クリアタイム順ランキング"></ol>
      <footer class="board__footer">
        <span>クリアタイム順 / 上位100件</span>
        <span id="updated-at"></span>
      </footer>
    </section>
    <p class="privacy-note">審査中の記録は、承認されるまでニックネームを表示しません。</p>
  </main>

  <footer class="site-footer">
    <span>KEY-RUNNER</span>
    <span>v.0.4.1</span>
  </footer>
</body>
</html>
